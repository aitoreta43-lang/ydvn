<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nikhil Yadav • Instagram Profile Card</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0c12, #030507);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
            position: relative;
            cursor: default;
        }

        /* animated gradient orb */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at 40% 50%, rgba(224, 49, 110, 0.12), rgba(0, 0, 0, 0) 70%);
            animation: slowDrift 22s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes slowDrift {
            0% { transform: translate(0%, 0%) rotate(0deg); opacity: 0.5; }
            100% { transform: translate(3%, 4%) rotate(6deg); opacity: 0.9; }
        }

        /* main card */
        .ig-card {
            max-width: 400px;
            width: 100%;
            background: rgba(18, 20, 26, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 1.8rem 1.6rem 2rem 1.6rem;
            box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.4s ease;
            animation: cardFloatUp 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
            z-index: 2;
        }

        .ig-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 35px 55px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        @keyframes cardFloatUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* avatar ring + story effect */
        .avatar-section {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .avatar-wrapper {
            position: relative;
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background: linear-gradient(135deg, #feda77, #d62976, #962fbf, #4f5bd5);
            padding: 3px;
            transition: transform 0.25s ease;
            cursor: pointer;
        }
        .avatar-wrapper:hover {
            transform: scale(1.02);
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #f9ce34, #ee2a7b, #6228d7, #f9ce34);
            opacity: 0;
            transition: opacity 0.4s;
            z-index: -1;
        }
        .avatar-wrapper:hover::before {
            opacity: 0.7;
            animation: rotateRing 1.8s linear infinite;
        }
        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #1e1f24;
            border: 2px solid #0f1117;
            transition: filter 0.3s;
        }
        .avatar-wrapper:hover .avatar-img {
            filter: brightness(1.02) contrast(1.02);
        }

        /* user info */
        .display-name {
            font-size: 1.7rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.3px;
            background: linear-gradient(120deg, #fff, #ddd);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-top: 0.5rem;
        }
        .username {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            color: #a8abb3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }
        .username i {
            color: #3897f0;
            font-size: 0.8rem;
        }
        .bio {
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #cdd0d9;
            margin: 1rem 0 0.6rem 0;
            font-weight: 400;
            padding: 0 0.2rem;
        }
        .location-website {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin: 0.7rem 0 1rem;
            font-size: 0.75rem;
            color: #9da2ae;
        }
        .location-website span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            transition: all 0.2s;
        }
        .location-website span i {
            font-size: 0.7rem;
            color: #e0aaff;
        }
        .location-website span:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
            color: #f0f3fa;
        }

        /* stats row */
        .stats-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
            background: rgba(12, 14, 19, 0.7);
            border-radius: 2rem;
            padding: 0.8rem 0.4rem;
            margin: 1rem 0 1.4rem;
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }
        .stat {
            flex: 1;
            transition: transform 0.2s ease;
            cursor: default;
        }
        .stat:hover {
            transform: scale(1.05);
        }
        .stat-number {
            font-weight: 800;
            font-size: 1.45rem;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            color: #9499aa;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* button group */
        .action-buttons {
            display: flex;
            gap: 14px;
            margin-top: 0.5rem;
        }
        .btn {
            flex: 1;
            padding: 0.7rem 0;
            border-radius: 2.2rem;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: none;
            font-family: 'Inter', sans-serif;
            background: transparent;
        }
        .follow {
            background: linear-gradient(95deg, #0095f6, #1d6bf0);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 149, 246, 0.25);
        }
        .following {
            background: rgba(50, 55, 70, 0.8);
            backdrop-filter: blur(4px);
            color: #eef2ff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .message-btn {
            background: rgba(30, 33, 44, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #eef2ff;
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-pop {
            animation: btnPop 0.2s ease-out forwards !important;
        }
        @keyframes btnPop {
            0% { transform: scale(1); }
            50% { transform: scale(0.94); }
            100% { transform: scale(1); }
        }

        /* extra flair */
        .instagram-badge {
            display: flex;
            justify-content: flex-end;
            margin-top: 1.2rem;
            font-size: 0.7rem;
            color: #676c7c;
            gap: 8px;
            align-items: center;
            border-top: 0.5px solid rgba(255, 255, 255, 0.06);
            padding-top: 1rem;
        }
        .instagram-badge i {
            font-size: 0.85rem;
            color: #d62976;
        }
        .instagram-badge span {
            transition: 0.2s;
        }
        .instagram-badge span:hover {
            color: #f5f9ff;
            cursor: default;
        }

        /* responsive */
        @media (max-width: 450px) {
            .ig-card {
                padding: 1.5rem 1.2rem;
            }
            .display-name {
                font-size: 1.45rem;
            }
            .stat-number {
                font-size: 1.2rem;
            }
            .btn {
                font-size: 0.8rem;
                padding: 0.6rem 0;
            }
        }
    </style>
</head>
<body>

<div class="ig-card">
    <!-- Avatar with story ring animation -->
    <div class="avatar-section">
        <div class="avatar-wrapper">
            <img class="avatar-img" 
                 src="https://randomuser.me/api/portraits/men/32.jpg" 
                 alt="Nikhil Yadav profile" 
                 onerror="this.src='https://ui-avatars.com/api/?background=1E1F2C&color=fff&bold=true&size=100&name=N+Y'">
        </div>
    </div>

    <!-- Name + username -->
    <div class="display-name">Nikhil Yadav</div>
    <div class="username">
        <i class="fab fa-instagram"></i> yadav_nikhil_207
        <i class="fas fa-check-circle" style="color: #3897f0; font-size: 0.7rem;"></i>
    </div>

    <!-- Bio -->
    <div class="bio">
        ✨ Building digital dreams • Tech & travel storyteller <br>
        📍 Exploring code & creativity | DM for collabs 🤝
    </div>

    <!-- Location & website row -->
    <div class="location-website">
        <span><i class="fas fa-map-marker-alt"></i> Delhi, India</span>
        <span><i class="fas fa-link"></i> nikhilcreates.in</span>
    </div>

    <!-- Stats (Posts, Followers, Following) -->
    <div class="stats-row">
        <div class="stat">
            <div class="stat-number" id="posts-count">132</div>
            <div class="stat-label">Posts</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="followers-count">2,345</div>
            <div class="stat-label">Followers</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="following-count">456</div>
            <div class="stat-label">Following</div>
        </div>
    </div>

    <!-- Buttons: Follow + Message with interactive animations -->
    <div class="action-buttons">
        <button class="btn follow" id="follow-btn">
            <i class="fas fa-user-plus"></i> Follow
        </button>
        <button class="btn message-btn" id="message-btn">
            <i class="far fa-paper-plane"></i> Message
        </button>
    </div>

    <!-- small instagram footer detail -->
    <div class="instagram-badge">
        <i class="fab fa-instagram"></i>
        <span>instagram.com/yadav_nikhil_207</span>
        <i class="fas fa-globe" style="font-size: 0.7rem; margin-left: auto;"></i>
    </div>
</div>

<script>
    (function() {
        // ---------- UI state for dynamic follow interaction ----------
        let isFollowing = false;           // start with "Follow" state
        let currentFollowers = 2345;       // matches initial displayed value (2,345)
        
        // DOM elements
        const followersSpan = document.getElementById('followers-count');
        const followButton = document.getElementById('follow-btn');
        const messageButton = document.getElementById('message-btn');
        
        // Helper: format number with commas
        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }
        
        // Update followers UI with smooth number transition (visual only)
        function updateFollowersUI() {
            followersSpan.innerText = formatNumber(currentFollowers);
            // little micro animation on the number (pop effect)
            followersSpan.style.transform = 'scale(1.1)';
            setTimeout(() => {
                if(followersSpan) followersSpan.style.transform = '';
            }, 150);
        }
        
        // Update button appearance & text based on isFollowing flag
        function updateButtonStyle() {
            if (isFollowing) {
                followButton.innerHTML = '<i class="fas fa-check-circle"></i> Following';
                followButton.classList.remove('follow');
                followButton.classList.add('following');
            } else {
                followButton.innerHTML = '<i class="fas fa-user-plus"></i> Follow';
                followButton.classList.remove('following');
                followButton.classList.add('follow');
            }
        }
        
        // Follow/Unfollow logic with count increment/decrement
        function toggleFollow() {
            // Add small haptic-like animation to button
            followButton.classList.add('btn-pop');
            setTimeout(() => followButton.classList.remove('btn-pop'), 220);
            
            if (!isFollowing) {
                // FOLLOW action
                isFollowing = true;
                currentFollowers += 1;
                // optional: small bounce on followers count
                updateFollowersUI();
                updateButtonStyle();
                
                // Extra micro interaction: show subtle 'followed' tooltip-like feeling (no alert)
                const originalText = followButton.innerHTML;
                followButton.style.transform = 'scale(0.98)';
                setTimeout(() => { if(followButton) followButton.style.transform = ''; }, 120);
                
            } else {
                // UNFOLLOW action
                isFollowing = false;
                currentFollowers -= 1;
                updateFollowersUI();
                updateButtonStyle();
                
                followButton.style.transform = 'scale(0.98)';
                setTimeout(() => { if(followButton) followButton.style.transform = ''; }, 120);
            }
        }
        
        // Message button interaction: elegant feedback (non-intrusive)
        function onMessageClick() {
            messageButton.classList.add('btn-pop');
            setTimeout(() => messageButton.classList.remove('btn-pop'), 220);
            
            // subtle ripple effect simulation + smooth alert replacement (better than default alert)
            // create a small temporary toast message for better UX
            const toast = document.createElement('div');
            toast.innerText = '📩 DM feature — connect with @yadav_nikhil_207';
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = 'rgba(0,0,0,0.85)';
            toast.style.backdropFilter = 'blur(12px)';
            toast.style.color = '#fff';
            toast.style.padding = '10px 22px';
            toast.style.borderRadius = '60px';
            toast.style.fontSize = '0.85rem';
            toast.style.fontWeight = '500';
            toast.style.fontFamily = "'Inter', sans-serif";
            toast.style.zIndex = '999';
            toast.style.boxShadow = '0 8px 18px rgba(0,0,0,0.3)';
            toast.style.border = '1px solid rgba(255,255,255,0.2)';
            toast.style.letterSpacing = '0.2px';
            toast.style.pointerEvents = 'none';
            document.body.appendChild(toast);
            
            // animate fade in/out
            toast.style.animation = 'fadeUpMsg 0.25s ease-out forwards';
            const styleSheet = document.createElement("style");
            styleSheet.textContent = `
                @keyframes fadeUpMsg {
                    0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
                    100% { opacity: 1; transform: translateX(-50%) translateY(0px); }
                }
                .toast-fadeout {
                    animation: fadeOutMsg 0.3s forwards !important;
                }
                @keyframes fadeOutMsg {
                    to { opacity: 0; transform: translateX(-50%) translateY(8px); visibility: hidden; }
                }
            `;
            document.head.appendChild(styleSheet);
            
            setTimeout(() => {
                toast.classList.add('toast-fadeout');
                setTimeout(() => {
                    if(toast && toast.remove) toast.remove();
                }, 280);
            }, 2200);
        }
        
        // also animate stat numbers on hover/extra micro: ensure numbers interactive
        // attach event listeners
        followButton.addEventListener('click', (e) => {
            e.preventDefault();
            toggleFollow();
        });
        
        messageButton.addEventListener('click', (e) => {
            e.preventDefault();
            onMessageClick();
        });
        
        // optional: smooth hover effect for stats (already done with CSS but dynamic nice)
        const statDivs = document.querySelectorAll('.stat');
        statDivs.forEach(stat => {
            stat.addEventListener('mouseenter', () => {
                stat.style.transition = 'transform 0.2s ease';
            });
        });
        
        // small easter egg: double click avatar -> heart pop like instagram story
        const avatarWrap = document.querySelector('.avatar-wrapper');
        if(avatarWrap) {
            avatarWrap.addEventListener('dblclick', (e) => {
                // create floating heart animation
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart';
                heart.style.position = 'absolute';
                heart.style.color = '#ff3040';
                heart.style.fontSize = '2rem';
                heart.style.filter = 'drop-shadow(0 0 4px rgba(255,48,64,0.5))';
                heart.style.left = `${e.offsetX}px`;
                heart.style.top = `${e.offsetY}px`;
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '20';
                heart.style.transform = 'scale(0)';
                heart.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.5s';
                avatarWrap.style.position = 'relative';
                avatarWrap.appendChild(heart);
                requestAnimationFrame(() => {
                    heart.style.transform = 'scale(1.2)';
                    heart.style.opacity = '0.9';
                });
                setTimeout(() => {
                    heart.style.transform = 'scale(1.8)';
                    heart.style.opacity = '0';
                    setTimeout(() => heart.remove(), 400);
                }, 200);
                // also tiny vibration like pulse on avatar
                avatarWrap.style.transform = 'scale(1.02)';
                setTimeout(() => { if(avatarWrap) avatarWrap.style.transform = ''; }, 150);
            });
        }
        
        // ensure that initial numbers are consistent in case of any mismatch
        // Also posts and following counts are fixed but we can also add interactive follow/unfollow only updates followers count
        // For clean UX we set no side effect on posts/following, but the design shows real values
        // final check: format follower count correctly
        function initDisplay() {
            followersSpan.innerText = formatNumber(currentFollowers);
            // ensure posts count is shown as "132" and following "456"
            document.getElementById('posts-count').innerText = '132';
            document.getElementById('following-count').innerText = '456';
            // button state default (unfollowed)
            isFollowing = false;
            currentFollowers = 2345;
            updateFollowersUI();
            updateButtonStyle();
        }
        
        initDisplay();
        
        // add entrance ripple animation for stats (just delight)
        const statsRow = document.querySelector('.stats-row');
        if(statsRow) {
            statsRow.style.animation = 'softGlow 0.4s ease-out';
            const keyframes = `
                @keyframes softGlow {
                    0% { opacity: 0.7; transform: scale(0.98); background: rgba(0,0,0,0.3);}
                    100% { opacity: 1; transform: scale(1); background: rgba(12,14,19,0.7);}
                }
            `;
            const style = document.createElement('style');
            style.textContent = keyframes;
            document.head.appendChild(style);
        }
    })();
</script>
</body>
</html>
